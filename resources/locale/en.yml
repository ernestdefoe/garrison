ernestdefoe-garrison:

  api:
    errors:
      unknown_verb: That is not something Garrison can ask a server to do.
      not_permitted: You do not have permission to do that to this server.
      name_required: Give the host a name.
      upload_failed: That file did not arrive. Try again.
      not_an_image: That is not an image Garrison can use. PNG, JPEG, GIF or WebP.
      too_large: That image is over 512 KB. Use a smaller one.
      no_artwork: Garrison does not know where to find artwork for this game. Upload an image instead.
      fetch_failed: Could not fetch that image. Upload one instead.
      not_a_url: That is not a web address.
      bad_scheme: Only http and https addresses can be fetched.
      unresolvable: That address does not resolve to anything.
      private_address: That address points inside this network, so Garrison will not fetch it.

  # 🚨 Email copy, and the one place in this file where a mistake cannot be
  # taken back — a forum post can be edited, a sent email cannot. The subject
  # names the server, because this is read on a lock screen.
  email:
    server_incident:
      subject:
        down: "{name} is down"
        unready: "{name} stopped accepting players"
        recovered: "{name} is back up"
        abandoned: "{name} still needs a hand"
      # 🚨 ONE body per state, shared by the plain and HTML templates.
      #
      # The HTML view renders this same text through Flarum's own formatter,
      # which turns the blank lines into paragraphs and the bare URL into a
      # link. Writing HTML here instead would not work — the formatter parses
      # forum markup, not markup you hand it — and two copies of the same
      # sentence is how a copy fix lands in one of them.
      body:
        down: |-
          {name} is not running, and Garrison could not get it started again.

          {url}
        unready: |-
          {name} is running, but players cannot get in. Garrison noticed because its health checks stopped passing, not because the process stopped — from the outside it still looks fine.

          {url}
        recovered: |-
          {name} is accepting players again. Nothing else is needed.

          {url}
        abandoned: |-
          Garrison has restarted {name} several times and it keeps failing the same way, so it has stopped trying rather than restart it in a loop. It needs somebody to look at it.

          {url}
        finding: "What the health check saw: {finding}"

  forum:
    # The notification component reads these. The state is mapped to a key
    # through a closed switch rather than interpolated, so an unexpected state
    # can never ask for a key that does not exist.
    notification:
      down: "{name} is down"
      unready: "{name} stopped accepting players"
      recovered: "{name} is back"
      abandoned: "Garrison has stopped trying to fix {name}"

    settings:
      # 🚨 The label on the checkbox in a user's own notification preferences.
      # The key is `notify_<blueprint type>_label` — the type verbatim,
      # camelCase and all. Without this row the checkbox renders its raw key,
      # and without the grid entry in index.js there is no checkbox at all:
      # the preference exists and nothing can change it.
      notify_garrisonServerIncident_label: A game server I help run needs attention

    # 🚨 Every user-facing string lives here. Zero hardcoded English anywhere
    # in PHP or JS — a community running in German must get a German panel.
    title: Game servers
    state:
      running: Running
      stopped: Stopped
      starting: Starting
      stopping: Stopping
      crashed: Crashed
      unknown: Unknown
    stale: "Last heard from {when}"
    stale_short: Not reporting
    players: "{count, plural, one {# player} other {# players}} online"
    no_servers: No game servers are set up yet.
    unreachable: Could not reach the forum for server status.
    join_hidden: Join details are not shown to your group.
    widget_heading: Heading
    see_all: All servers
    join: How to join
    join_code: "Join code {code}"
    action_failed: That did not work. Try again in a moment.
    console: Console
    console_empty: Nothing here yet. Output appears as the server produces it.
    console_placeholder: Type a command for the server
    console_send: Send
    confirm_stop: "Stop {name}? Anybody playing will be disconnected."

    health:
      unready: Players cannot join
      unready_short: Cannot join
      attention: Needs attention
      attention_detail: Garrison restarted this server and it did not come back. Automatic restarts have stopped.
      attention_short: Needs you
      unchecked: Not checked — no readiness probes are set up for this game.

    action:
      start: Start
      stop: Stop
      restart: Restart

    fact:
      players: Players
      cpu: CPU
      memory: Memory
      uptime: Started
      driver: Runs as

  admin:
    title: Garrison
    alerts: Alerts
    webhook: Discord or webhook address
    webhook_help: Posted to when a server stops accepting players, and again when it comes back. A Discord webhook address is detected automatically; anything else receives JSON.
    load_failed: Could not load Garrison's state.

    hosts: Game hosts
    no_hosts: No hosts paired yet. Give one a name and pair it, then put the token in that host's agent config.
    host_name_placeholder: A name for the host
    pair: Pair a host
    unpair: Unpair
    unpair_confirm: "Unpair {name}? Its {count} server(s) will disappear from the forum until it is paired again."
    host_seen: "Last heard from {when}"
    host_late: "⚠ Silent since {when}"
    host_never: Has never checked in

    token_heading: "{name} is paired"
    token_once: This token is shown once and is stored nowhere. Copy it now — if you lose it you will have to unpair and pair again.
    token_next: Put it in the host's agent config as the token, then start the agent.
    token_copied: I have copied it

    servers: Servers
    field_name: Name
    field_join_address: Address
    field_join_password: Password
    field_join_code: Join code
    public: Show this server to everyone, including guests
    auto_remediate: Restart this server automatically when it stops accepting players
    attention: Garrison stopped trying to restart this server. It needs looking at.
    clear_attention: I have looked — resume automatic restarts
    backup_every: Back up automatically, every (hours)
    backup_every_help: Zero means no automatic backups. The agent keeps the most recent copies and never deletes a safety copy taken before a restore.
    icon: Server image
    icon_help: PNG, JPEG, GIF or WebP, up to 512 KB. Uploaded and kept here, so it cannot disappear later.
    fetch_logo: Fetch the real logo
    fetch_logo_help: Downloads the game's own logo and keeps a copy on this forum. Not a hotlink — it cannot break later.
    logo_url: Or paste an image address
    logo_url_help: For games Garrison does not know, paste a link to the logo. It is downloaded and kept here, so it cannot break later.
    fetch: Fetch

    incidents: Recent incidents
    no_incidents: Nothing has gone wrong yet.

    permissions:
      # 🚨 Worded so the grid says what each one actually does. "View game
      # servers" would be a lie: a public server is visible to everyone
      # without any permission at all.
      view: See servers that are not marked public
      control: Start, stop and restart servers
      console: Send commands to a game console
      manage: Manage Garrison, pair hosts, see everything
