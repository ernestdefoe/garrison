ernestdefoe-garrison:

  api:
    errors:
      unknown_verb: That is not something Garrison can ask a server to do.
      not_permitted: You do not have permission to do that to this server.

  forum:
    # 🚨 Every user-facing string lives here. Zero hardcoded English anywhere
    # in PHP or JS — a community running in German must get a German panel.
    title: Game servers
    state:
      running: Running
      stopped: Stopped
      starting: Starting
      stopping: Stopping
      crashed: Crashed
      unknown: Unknown
    stale: "Last heard from {when}"
    players: "{count, plural, one {# player} other {# players}} online"
    no_servers: No game servers are set up yet.
    unreachable: Could not reach the forum for server status.
    join_hidden: Join details are not shown to your group.
    widget_heading: Heading
    see_all: All servers
    join: How to join
    join_code: "Join code {code}"
    action_failed: That did not work. Try again in a moment.
    confirm_stop: "Stop {name}? Anybody playing will be disconnected."

    health:
      unready: Players cannot join
      unready_short: Cannot join
      attention: Needs attention
      attention_detail: Garrison restarted this server and it did not come back. Automatic restarts have stopped.
      attention_short: Needs you
      unchecked: Not checked — no readiness probes are set up for this game.

    action:
      start: Start
      stop: Stop
      restart: Restart

    fact:
      players: Players
      cpu: CPU
      memory: Memory
      uptime: Started
      driver: Runs as

  admin:
    title: Garrison

    permissions:
      # 🚨 Worded so the grid says what each one actually does. "View game
      # servers" would be a lie: a public server is visible to everyone
      # without any permission at all.
      view: See servers that are not marked public
      control: Start, stop and restart servers
      console: Send commands to a game console
      manage: Manage Garrison, pair hosts, see everything
